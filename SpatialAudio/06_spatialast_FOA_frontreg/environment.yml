name: spatialast-foa
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchaudio
  - numpy
  - scipy
  - soundfile
  - librosa

# Notes:
# - `timm` is intentionally excluded.
# - For NVIDIA GPU use, install a PyTorch build that matches your GPU architecture.
# - On very new GPUs, you may need a newer `pytorch` / `pytorch-cuda` combo than the
#   legacy `spatial-ast` environment currently uses.
