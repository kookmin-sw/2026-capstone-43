[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm3d-l3das23-single-mic"
version = "0.1.0"
description = "Single-source HM3D audio-visual dataset generation pipeline with geometric gLOS/gNLOS labels."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "imageio>=2.31",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "soundfile>=0.12",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
hm3d-l3das23-generate = "hm3d_l3das23_single_mic.main_generate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
