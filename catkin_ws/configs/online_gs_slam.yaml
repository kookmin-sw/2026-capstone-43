data:
  poll_interval: 0.2
  max_frames:
  idle_timeout:

system:
  device: cuda
  save_every_n_frames: 10

renderer:
  backend: gsplat
  downscale: 4
  background: 0.0
  near_plane: 0.01
  far_plane: 100.0
  eps2d: 0.3
  packed: true
  rasterize_mode: classic
  render_mode: RGB

gaussian_map:
  material_dim: 16
  prune_opacity_threshold: 0.01
  max_gaussians: 200000

insertion:
  stride: 24
  rgb_only_depth: 1.5
  max_insert_per_frame: 1200
  initial_scale: 0.025

tracking:
  optimize_pose: false
  iterations: 10
  learning_rate: 0.001

mapping:
  local_opt_steps: 3
  learning_rate: 0.01
  opacity_increment: 0.02
  visible_radius: 5.0
  insert_every_n_frames: 1
  optimize_max_gaussians: 8000
  optimize_means: true
  optimize_scales: true
  optimize_colors: true
  optimize_opacity: true
  scale_reg: 0.001
  opacity_reg: 0.0001
  train_local_window: true

keyframes:
  translation_threshold: 0.15
  rotation_threshold_deg: 12.0
  frame_interval: 10
  local_window_size: 8
